[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wattwise"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastmcp==2.14.5", "mcp==1.26.0", "fastapi==0.143.0", "uvicorn==0.54.0", "boto3==1.43.111", "python-dotenv==1.2.4"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
solver = ["highspy==1.15.1", "numpy==2.5.4"]

[tool.setuptools.packages.find]
include = ["wattwise*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
